<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobil Co-Op Oyunu</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #1a1a1a; color: white;
            font-family: Arial, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }
        #info { margin-bottom: 5px; font-size: 14px; text-align: center; }
        canvas { border: 2px solid #fff; background-color: #2c3e50; max-width: 95vw; max-height: 50vh; }
        .controls-container { display: flex; justify-content: space-between; width: 100%; max-width: 600px; padding: 10px; box-sizing: border-box; }
        .pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; }
        .btn { background: #555; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; }
        .btn:active { background: #888; }
        #p1-up { grid-column: 2; grid-row: 1; }
        #p1-left { grid-column: 1; grid-row: 2; }
        #p1-down { grid-column: 2; grid-row: 2; }
        #p1-right { grid-column: 3; grid-row: 2; }
        #p2-up { grid-column: 2; grid-row: 1; }
        #p2-left { grid-column: 1; grid-row: 2; }
        #p2-down { grid-column: 2; grid-row: 2; }
        #p2-right { grid-column: 3; grid-row: 2; }
        .p1-btn { background: #3498db; }
        .p2-btn { background: #e74c3c; }
    </style>
</head>
<body>
    <div id="info">Mavi ve Kırmızı Oyuncu - Butona Bas ve Kapıyı Aç!</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="controls-container">
        <div class="pad">
            <button class="btn p1-btn" id="p1-up">↑</button>
            <button class="btn p1-btn" id="p1-left">←</button>
            <button class="btn p1-btn" id="p1-down">↓</button>
            <button class="btn p1-btn" id="p1-right">→</button>
        </div>
        <div class="pad">
            <button class="btn p2-btn" id="p2-up">↑</button>
            <button class="btn p2-btn" id="p2-left">←</button>
            <button class="btn p2-btn" id="p2-down">↓</button>
            <button class="btn p2-btn" id="p2-right">→</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
